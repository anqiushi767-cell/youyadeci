<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050807" />
  <title>NOCTURNE // 夜光档案</title>
  <meta name="description" content="一个黑绿色的个人照片档案站" />
  <link rel="icon" href="./favicon.svg" />
  <!-- 标题字体 + 正文字体（两套字体搭配） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- 提前应用记忆的主题，避免闪烁 -->
  <script>
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('nocturne-theme') || 'dark'
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
